name: ofm-check
on:
  pull_request:
    branches: [main]

jobs:
  ofm-check:
    runs-on: ${{ vars.WP3_RUNNER_LABEL }}
    steps:
      - name: Checkout triggering commit without an external action
        run: |
          set -euo pipefail
          test -n "${WP3_FORGE_INTERNAL_ORIGIN:-}"
          test -n "${GITHUB_REPOSITORY:-}"
          test -n "${GITHUB_SHA:-}"
          test -n "${FORGEJO_TOKEN:-}"
          "${CYBERBASER_TOOL_ROOT}/private-checkout" \
            workspace \
            "${WP3_FORGE_INTERNAL_ORIGIN}/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_SHA}" \
            main
      - name: Reject workflow and fixture-tooling changes
        run: |
          set -euo pipefail
          changed="$(git -C workspace diff --name-only "refs/remotes/origin/main" "${GITHUB_SHA}")"
          if printf '%s\n' "$changed" | grep -Eq '^(\.forgejo/workflows/|fixture-tools/)'; then
            printf '%s\n' 'controlled PR changed protected workflow or fixture tooling' >&2
            exit 1
          fi
      - name: Run the allowlisted Cyberbaser OFM tool
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/wp3-before.md"
          git -C workspace show "refs/remotes/origin/main:content/page.md" > "$before"
          "${CYBERBASER_TOOL_ROOT}/ofm-check" diff "$before" workspace/content/page.md
