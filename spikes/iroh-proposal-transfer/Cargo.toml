[package]
name = "cyberbaser-iroh-proposal-transfer"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
blake3 = "=1.8.6"
iroh = { version = "=1.0.3", features = ["test-utils"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
