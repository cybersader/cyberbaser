[package]
name = "cyberbaser-iroh-editor-carrier"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh = { version = "=1.0.3", default-features = false, features = ["tls-ring"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
iroh-relay = { version = "=1.0.3", default-features = false, features = ["server", "tls-ring"] }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"

[profile.dev]
debug = 0
