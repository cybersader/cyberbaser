name: Proposal package CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/proposal/**'
      - 'packages/correction/**'
      - 'packages/ofm/**'
      - 'packages/trust/**'
      - '.github/workflows/proposal.yml'
  pull_request:
    paths:
      - 'packages/proposal/**'
      - 'packages/correction/**'
      - 'packages/ofm/**'
      - 'packages/trust/**'
      - '.github/workflows/proposal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proposal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Cyberbaser
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.11'

      - name: Install locked proposal dependency closure
        run: |
          bun install --cwd packages/ofm --frozen-lockfile
          bun install --cwd packages/trust --frozen-lockfile
          bun install --cwd packages/proposal --frozen-lockfile

      - name: Run proposal package tests
        run: bun test packages/proposal/test
