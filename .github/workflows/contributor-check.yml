name: Contributor check

# The one command CONTRIBUTING.md documents, run on a GitHub-hosted runner with
# nothing from anyone's machine, plus the tracked-files guard (no home-directory
# paths, workflows pin the Bun version in .bun-version).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contributor-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracked-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check tracked files
        run: bash scripts/check-tracked-files.sh

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.11'
      - name: bun run check
        run: bun run check
