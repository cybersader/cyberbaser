name: Account-free intake container

on:
  push:
    branches: [main]
    paths:
      - 'apps/account-free-intake/**'
      - 'packages/account-free-intake/**'
      - 'packages/proposal-queue/**'
      - 'packages/proposal/**'
      - 'packages/correction/**'
      - 'packages/ofm/**'
      - 'packages/trust/**'
      - 'deploy/account-free-intake/**'
      - '.github/workflows/account-free-intake-container.yml'
  pull_request:
    paths:
      - 'apps/account-free-intake/**'
      - 'packages/account-free-intake/**'
      - 'packages/proposal-queue/**'
      - 'packages/proposal/**'
      - 'packages/correction/**'
      - 'packages/ofm/**'
      - 'packages/trust/**'
      - 'deploy/account-free-intake/**'
      - '.github/workflows/account-free-intake-container.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-free-intake-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up exact Bun runtime
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.11'

      - name: Install the locked account-free intake dependency closure
        run: |
          bun install --cwd packages/ofm --frozen-lockfile
          bun install --cwd packages/trust --frozen-lockfile
          bun install --cwd packages/proposal --frozen-lockfile
          bun install --cwd packages/proposal-queue --frozen-lockfile
          bun install --cwd packages/account-free-intake --frozen-lockfile
          bun install --cwd apps/account-free-intake --frozen-lockfile

      - name: Run structural and hermetic deployment tests
        run: bun test deploy/account-free-intake/test

      - name: Build the local Linux amd64 image
        run: docker build --progress=plain --file deploy/account-free-intake/Containerfile --tag cyberbaser-account-free-intake:ci .

      - name: Resolve the immutable local image ID
        run: |
          set -euo pipefail
          image_id="$(docker image inspect --format '{{.Id}}' cyberbaser-account-free-intake:ci)"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'ACCOUNT_FREE_INTAKE_CONTAINER_IMAGE=%s\n' "$image_id" >> "$GITHUB_ENV"

      - name: Run isolated image acceptance
        run: bun test deploy/account-free-intake/test/runtime-acceptance.test.js
