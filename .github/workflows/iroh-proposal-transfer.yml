name: Iroh proposal-transfer fixture

on:
  push:
    branches: [main]
    paths:
      - 'spikes/iroh-proposal-transfer/**'
      - 'packages/proposal/**'
      - 'packages/proposal-queue/**'
      - 'packages/correction/**'
      - 'packages/ofm/**'
      - 'packages/trust/**'
      - '.github/workflows/iroh-proposal-transfer.yml'
  pull_request:
    paths:
      - 'spikes/iroh-proposal-transfer/**'
      - 'packages/proposal/**'
      - 'packages/proposal-queue/**'
      - 'packages/correction/**'
      - 'packages/ofm/**'
      - 'packages/trust/**'
      - '.github/workflows/iroh-proposal-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iroh-proposal-transfer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.97.1'

      - name: Install locked Bun dependencies
        run: bun install --cwd spikes/iroh-proposal-transfer --frozen-lockfile

      - name: Run locked Rust tests
        run: cargo test --locked --manifest-path spikes/iroh-proposal-transfer/Cargo.toml

      - name: Run fixture tests
        run: bun test spikes/iroh-proposal-transfer/test

      - name: Verify read-only workflow structure
        run: bun test packages/proposal-queue/test/ci-structure.test.js

      - name: Run deterministic fixture verifier
        run: bun run spikes/iroh-proposal-transfer/bin/verify.js
