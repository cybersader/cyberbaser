name: Owner alpha container

on:
  push:
    branches: [main]
    paths:
      - 'apps/owner-alpha/**'
      - 'packages/correction/**'
      - 'packages/linkcheck/**'
      - 'packages/ofm/**'
      - 'packages/projection/**'
      - 'packages/publish/**'
      - 'packages/trust/**'
      - 'renderers/quartz-cyberbase/**'
      - 'deploy/owner-alpha/**'
      - '.github/workflows/owner-alpha-container.yml'
  pull_request:
    paths:
      - 'apps/owner-alpha/**'
      - 'packages/correction/**'
      - 'packages/linkcheck/**'
      - 'packages/ofm/**'
      - 'packages/projection/**'
      - 'packages/publish/**'
      - 'packages/trust/**'
      - 'renderers/quartz-cyberbase/**'
      - 'deploy/owner-alpha/**'
      - '.github/workflows/owner-alpha-container.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-alpha-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up exact Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.11'

      - name: Install the locked owner-alpha dependency closure
        working-directory: apps/owner-alpha
        run: bun install --frozen-lockfile

      - name: Install the locked browser fixture dependencies
        working-directory: docs
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Run structural and hermetic script tests
        run: bun test deploy/owner-alpha/test

      - name: Run the hermetic browser Save fixture
        run: OWNER_ALPHA_ACCEPTANCE=1 bun test apps/owner-alpha/test/acceptance.test.js

      - name: Build the local Linux amd64 image
        run: docker build --progress=plain --file deploy/owner-alpha/Containerfile --tag cyberbaser-owner-alpha:ci .

      - name: Resolve the immutable local image ID
        run: |
          set -euo pipefail
          image_id="$(docker image inspect --format '{{.Id}}' cyberbaser-owner-alpha:ci)"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'OWNER_ALPHA_CONTAINER_IMAGE=%s\n' "$image_id" >> "$GITHUB_ENV"

      - name: Run image and replacement acceptance
        run: bun test deploy/owner-alpha/test/runtime-acceptance.test.js
