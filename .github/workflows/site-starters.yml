name: Site starter CI
on:
  pull_request:
    paths: &starter-paths
      - 'starters/**'
      - 'renderers/quartz-cyberbase/**'
      - 'packages/publish/**'
      - 'packages/projection/**'
      - 'docs/**'
      - '.github/workflows/site-starters.yml'
  push:
    branches: [main]
    paths: *starter-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-starters-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-read:
    runs-on: ubuntu-24.04 # supported by the pinned Playwright 1.59.1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.11'
      - name: Install locked dependencies
        run: |
          for p in packages/publish packages/projection starters/solid docs; do bun install --cwd "$p" --frozen-lockfile; done
          docs/node_modules/.bin/playwright install --with-deps chromium
      - name: Test publication, projection and both renderers
        run: |
          bun test packages/publish/test packages/projection/test
          bash renderers/quartz-cyberbase/tests/run.sh
          bun run --cwd starters/solid test
      - name: Build both sites and exercise their pages
        run: bash starters/tests/check.sh
      - name: Build documentation
        working-directory: docs
        run: bun run build
