name: Account-free intake CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/account-free-intake/**'
      - 'packages/proposal-queue/**'
      - 'packages/proposal/**'
      - 'packages/correction/**'
      - 'packages/ofm/**'
      - 'packages/trust/**'
      - 'apps/account-free-intake/**'
      - 'renderers/quartz-cyberbase/**'
      - '.github/workflows/account-free-intake.yml'
      - '.github/workflows/proposal-queue.yml'
  pull_request:
    paths:
      - 'packages/account-free-intake/**'
      - 'packages/proposal-queue/**'
      - 'packages/proposal/**'
      - 'packages/correction/**'
      - 'packages/ofm/**'
      - 'packages/trust/**'
      - 'apps/account-free-intake/**'
      - 'renderers/quartz-cyberbase/**'
      - '.github/workflows/account-free-intake.yml'
      - '.github/workflows/proposal-queue.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-free-intake-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Cyberbaser
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.11'

      - name: Install locked proposal queue dependencies
        run: bun install --cwd packages/proposal-queue --frozen-lockfile

      - name: Install locked account-free adapter dependencies
        run: bun install --cwd packages/account-free-intake --frozen-lockfile

      - name: Install locked account-free app dependencies
        run: bun install --cwd apps/account-free-intake --frozen-lockfile

      - name: Run proposal queue package tests
        run: bun test packages/proposal-queue/test

      - name: Run account-free adapter package tests
        run: bun test packages/account-free-intake/test

      - name: Run account-free app tests
        run: bun test apps/account-free-intake/test

      - name: Run disabled renderer integration tests
        run: bash renderers/quartz-cyberbase/tests/run.sh
