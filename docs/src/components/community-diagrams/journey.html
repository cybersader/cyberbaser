  <details class="cb-map-description"><summary>Workflow and implementation limits</summary><p>Readers, recurring contributors and replaceable tools submit source-bound proposals, not source writes. The example sentence is synthetic. Review may close the proposal, request a new revision or record approval. A new revision needs its own review; the feedback loop is proposed, not implemented. Approval alone changes no source. A separate authorized owner act starts exact application and permitted publication. Today's Apply action combines those effects. Account-free public participation, passkey accounts and richer revision workflows remain target capabilities.</p></details>
