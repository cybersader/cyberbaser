  <details class="cb-map-description"><summary>Sequence and optional branches</summary><p>First select account custody, origin, recovery and authority contracts. Prove owner authority synthetically before separately authorizing a real source-bound publication loop. Finish usable account-free participation, then support recurring contributors with revision, feedback, history and credit contracts, and narrowly delegated review. Delegated release needs separate scoped authority decisions. Private collaboration and independent-peer evidence are optional later directions, not consequences of a publishing grant or a mandatory linear rollout; their dashed connections show conditional follow-on work rather than implementation prerequisites. Protocol work waits for demonstrated independent peer need. All stages retain the same authoritative source, exact-change boundary and evidence model. None of the nodes claims completion.</p></details>
