  <details class="cb-map-description"><summary>Boundary definitions and implementation limits</summary><p>External adapters send proposals to editorial review, which records a version-specific decision. Private account state supplies an actor for current authorization. An approved version and a separate explicit act reach the executor only under current actor, action, scope and grant checks. The executor applies exact source changes and gates each later effect. The canonical source provides only a selected projection to an isolated renderer. The renderer returns checked output, not source authority or credentials. The trusted publisher holds machine credentials, releases to the permitted destination and checks the live outcome. The dashed enclosure marks logical owner authority, not a selected container layout. Solid lines carry content or evidence, dashed arrows carry authorization checks, and labelled accent lines identify source or publication effects. Account custody needs approval; named-principal authorization, phase revocation and renderer isolation are target design rather than completed implementation.</p></details>
