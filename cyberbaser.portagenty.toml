# Workspace file for portagenty. See:
# https://cybersader.github.io/portagenty/reference/schema/
name = "cyberbaser"
multiplexer = "zellij"

[[session]]
name = "shell"
cwd = "."
command = "bash"
kind = "shell"

[[session]]
name = "agent"
cwd = "."
command = "claude"
kind = "claude-code"
description = "main coding agent"

[[session]]
name = "docs"
cwd = "docs"
command = "bun run dev:host" # Astro Starlight -> http://localhost:4321/cyberbaser/
kind = "dev-server"

[[session]]
name = "dogfood"
cwd = "spikes/human-correction-dry-run"
command = "bash"
kind = "shell"
description = "guided owner-dogfood shell; run bun run dogfood (starts no listener automatically)"

# ── Handy one-off commands (run from the matching shell session) ──────
# cd docs && bun run build                    # production build -> docs/dist/
# cd docs && bun run preview --host 0.0.0.0   # broad LAN bind; public docs only, never dogfood artifacts
# cd docs && bun run test:local               # headless Playwright smoke tests
# bun run dogfood                            # from `dogfood`; guided owner workflow
