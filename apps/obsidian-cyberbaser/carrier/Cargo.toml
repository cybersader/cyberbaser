[package]
name = "cyberbaser-obsidian-carrier"
version = "0.1.0"
edition = "2024"
publish = false
description = "Relay-only Iroh client for the Cyberbaser Obsidian plugin (WASM), plus a loopback relay used only by tests."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same iroh line as the owner node's @number0/iroh 1.2.0 bindings.
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
iroh-tickets = "=1.0.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iroh-relay = { version = "=1.2.0", default-features = false, features = ["server", "tls-ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-std", "io-util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
